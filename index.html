// ── KARTEN-MODUS ──
// Vollbild-Modus für Kartenmaterial mit Zeichenfunktion. Eigener Zoom/Pan-Zustand
// (M.zoom, M.panX, M.panY) und eigener Drawings-Speicher (S.mapDrawings als HTML-String).
const M = {
  zoom:1, panX:0, panY:0,
  isPanning:false, isDrawing:false, drawEl:null, panStart:null,
  // MBTiles-spezifisch
  source:'png',          // 'png' | 'mbtiles'
  mbMeta:null,           // Metadaten der aktuellen MBTiles-Karte
  mbTileSize:256,        // Standard-Kachelgröße
  mbWorldPx:256,         // Welt-Größe in Pixel bei zoom=0 (wird beim Laden gesetzt)
  mbCurrentZ:0,          // aktuell gerenderte Tile-Zoom-Stufe
  mbTilesShown:new Map(),// "z/x/y" → DOM-Element
};

// ── MBTiles-Modus für Karten ─────────────────────────────────────────────
// Lädt eine vorgekachelte MBTiles-Karte via Bridge (Rust-Backend).
// Im Gegensatz zum PNG-Modus werden Tiles dynamisch nach Sichtbarkeit nachgeladen.
async function loadMBTilesMap(){
  if(typeof window.MBTiles === 'undefined'){
    showInfo('MBTiles-Funktion noch nicht bereit. Die App-Bridge ist noch nicht initialisiert — bitte ein paar Sekunden warten und nochmal versuchen. Falls das Problem bleibt: prüfen ob boarddesk-tauri-bridge.js im Repo-Root liegt.');
    return;
  }
  if(!window.MBTiles.isTauri){
    showInfo('MBTiles-Funktion ist nur in der Desktop-App verfügbar. Im Browser-Modus bitte PNG verwenden.');
    return;
  }
  if(typeof window.MBTiles.openDialog !== 'function'){
    showInfo('MBTiles-Bridge unvollständig — die openDialog-Funktion fehlt. Wurde boarddesk-tauri-bridge.js aktualisiert?');
    return;
  }
  try{
    // Falls bereits eine MBTiles geöffnet ist, immer neu wählen lassen
    // (kein confirm() — das würde den Dialog-Plugin auslösen)
    // Fullscreen temporär verlassen, damit der native Datei-Dialog sichtbar ist
    let _wasFullscreen = false;
    try{
      if(window.__TAURI__){
        const _inv=(window.__TAURI_INTERNALS__||window.__TAURI__)?.core?.invoke||(window.__TAURI__?.tauri?.invoke);
        if(_inv){ await _inv('plugin:window|set_fullscreen',{value:false}).catch(()=>{}); _wasFullscreen=true; }
      }
    }catch(_){}
    await new Promise(r=>setTimeout(r,150)); // kurz warten bis OS Fenster angepasst hat
    await window.MBTiles.openDialog();
    const meta = await window.MBTiles.metadata();
    M.source = 'mbtiles';
    M.mbMeta = meta;
    // Welt-Größe bei zoom=0 = tileSize (typisch 256). Bei zoom=N: tileSize*2^N
    // Wir nutzen die maximale Zoom-Stufe der MBTiles als "Bild-Auflösung" für unsere Pan/Zoom-Logik
    const maxZ = meta.maxzoom ?? 14;
    M.mbWorldPx = M.mbTileSize * Math.pow(2, maxZ);
    // PNG-Bild ausblenden, Tile-Container einblenden
    const img = $('map-image');      if(img) img.style.display = 'none';
    const tiles = $('map-tiles');    if(tiles){
      tiles.style.display = 'block';
      tiles.style.width = M.mbWorldPx + 'px';
      tiles.style.height = M.mbWorldPx + 'px';
      [...tiles.children].forEach(c => c.remove());
      M.mbTilesShown.clear();
    }
    const hint = $('map-empty-hint'); if(hint) hint.style.display = 'none';
    const svg = $('map-draw-svg');
    if(svg){
      svg.setAttribute('width', M.mbWorldPx);
      svg.setAttribute('height', M.mbWorldPx);
      svg.setAttribute('viewBox', `0 0 ${M.mbWorldPx} ${M.mbWorldPx}`);
    }
    // In MBTiles-Modus speichern wir KEINE Karte in S.mapImage — der Pfad ist in localStorage
    S.mapSource = 'mbtiles';
    scheduleSave();
    resetMapView();
    renderMapTiles();
  }catch(err){
    // Fullscreen nach Dialog-Abbruch wiederherstellen
    try{
      if(window.__TAURI__ && _wasFullscreen){
        const _inv=(window.__TAURI_INTERNALS__||window.__TAURI__)?.core?.invoke||(window.__TAURI__?.tauri?.invoke);
        if(_inv) _inv('plugin:window|set_fullscreen',{value:true}).catch(()=>{});
      }
    }catch(_){}
    if(err && (err.message||'').toLowerCase().includes('abgebrochen')) return;
    showInfo('MBTiles konnte nicht geöffnet werden: '+(err?.message||err));
  }
  // Fullscreen nach Dialog wiederherstellen (egal ob Erfolg oder Fehler außer Abbruch)
  try{
    if(window.__TAURI__ && _wasFullscreen){
      const _inv=(window.__TAURI_INTERNALS__||window.__TAURI__)?.core?.invoke||(window.__TAURI__?.tauri?.invoke);
      if(_inv) _inv('plugin:window|set_fullscreen',{value:true}).catch(()=>{});
    }
  }catch(_){}
}

// Bestimmt die optimale Zoom-Stufe für die aktuelle Welt-Skalierung.
// Wenn M.zoom = 1 bedeutet das, dass 1 MBTiles-Pixel = 1 Bildschirm-Pixel.
function _mbBestZoomLevel(){
  if(!M.mbMeta) return 0;
  const minZ = M.mbMeta.minzoom ?? 0;
  const maxZ = M.mbMeta.maxzoom ?? 14;
  // bei maxZ haben wir die "Originalauflösung". Wenn M.zoom < 1, brauchen wir weniger Detail.
  // Formel: z = maxZ + log2(M.zoom)
  let z = Math.round(maxZ + Math.log2(M.zoom));
  if(z < minZ) z = minZ;
  if(z > maxZ) z = maxZ;
  return z;
}

// Rendert sichtbare Tiles für die aktuelle Ansicht
function renderMapTiles(){
  if(M.source !== 'mbtiles' || !M.mbMeta) return;
  const tilesContainer = $('map-tiles');
  const wrap = $('map-canvas-wrap');
  if(!tilesContainer || !wrap) return;
  const r = wrap.getBoundingClientRect();
  const z = _mbBestZoomLevel();
  const maxZ = M.mbMeta.maxzoom ?? 14;
  // Skala zwischen "World bei maxZ" (M.mbWorldPx) und Tile-Größe bei z
  const tilesAtZ = Math.pow(2, z);
  const worldAtZ = M.mbTileSize * tilesAtZ;
  // M.zoom skaliert die maxZ-Welt. Für Tile-Z müssen wir entsprechend umrechnen.
  const tileScreenSize = M.mbTileSize * M.zoom * (M.mbWorldPx / worldAtZ);
  // Sichtbarer Bereich in "World-bei-z"-Koordinaten
  const viewLeftWorld   = -M.panX / (M.zoom * M.mbWorldPx / worldAtZ);
  const viewTopWorld    = -M.panY / (M.zoom * M.mbWorldPx / worldAtZ);
  const viewRightWorld  = viewLeftWorld + r.width  / (M.zoom * M.mbWorldPx / worldAtZ);
  const viewBottomWorld = viewTopWorld  + r.height / (M.zoom * M.mbWorldPx / worldAtZ);
  // Welche Tile-Indizes brauchen wir? (mit kleinem Buffer)
  const buffer = 1;
  const xMin = Math.max(0, Math.floor(viewLeftWorld   / M.mbTileSize) - buffer);
  const yMin = Math.max(0, Math.floor(viewTopWorld    / M.mbTileSize) - buffer);
  const xMax = Math.min(tilesAtZ - 1, Math.floor(viewRightWorld  / M.mbTileSize) + buffer);
  const yMax = Math.min(tilesAtZ - 1, Math.floor(viewBottomWorld / M.mbTileSize) + buffer);
  // Set der jetzt nötigen Tile-Keys
  const needed = new Set();
  for(let y = yMin; y <= yMax; y++){
    for(let x = xMin; x <= xMax; x++){
      const key = `${z}/${x}/${y}`;
      needed.add(key);
      if(!M.mbTilesShown.has(key)){
        _addTile(z, x, y, key);
      }
    }
  }
  // Tiles entfernen, die nicht mehr gebraucht werden
  for(const [key, el] of M.mbTilesShown.entries()){
    if(!needed.has(key)){
      el.remove();
      M.mbTilesShown.delete(key);
    }
  }
}

async function _addTile(z, x, y, key){
  const tilesContainer = $('map-tiles');
  if(!tilesContainer) return;
  // Platzhalter sofort einfügen, damit wir bei mehrfachen Aufrufen kein Doppel-Laden haben
  const placeholder = document.createElement('div');
  placeholder.className = 'mb-tile';
  placeholder.dataset.key = key;
  M.mbTilesShown.set(key, placeholder);
  tilesContainer.appendChild(placeholder);
  try{
    const url = await window.MBTiles.getTileUrl(z, x, y);
    // Falls inzwischen wegnavigiert — Element könnte schon entfernt worden sein
    if(M.mbTilesShown.get(key) !== placeholder) return;
    // Tile-Position im "World-bei-maxZ" Koordinatensystem berechnen
    const maxZ = M.mbMeta.maxzoom ?? 14;
    const scale = Math.pow(2, maxZ - z);
    const px = x * M.mbTileSize * scale;
    const py = y * M.mbTileSize * scale;
    const size = M.mbTileSize * scale;
    placeholder.style.cssText =
      `position:absolute;left:${px}px;top:${py}px;width:${size}px;height:${size}px;` +
      `pointer-events:none;` +
      (url ? `background-image:url(${url});background-size:100% 100%;background-repeat:no-repeat;`
           : 'background:#0e0f11;');
    placeholder.dataset.url = url || '';
  }catch(_){
    if(M.mbTilesShown.get(key) === placeholder){
      placeholder.remove();
      M.mbTilesShown.delete(key);
    }
  }
}

function _clearMBTiles(){
  const tilesContainer = $('map-tiles');
  if(tilesContainer){
    // Blob-URLs freigeben
    M.mbTilesShown.forEach(el => {
      if(el.dataset.url) URL.revokeObjectURL(el.dataset.url);
    });
    [...tilesContainer.children].forEach(c => c.remove());
    tilesContainer.style.display = 'none';
  }
  M.mbTilesShown.clear();
}

function initMapMode(){
  const img = $('map-image');
  const hint = $('map-empty-hint');
  const wrap = $('map-canvas-wrap');
  const tilesContainer = $('map-tiles');
  if(!img || !hint || !wrap) return;
  const stored = S.mapSource || (S.mapImage ? 'png' : null);
  if(stored === 'mbtiles' && window.MBTiles && window.MBTiles.isTauri && window.MBTiles.currentPath){
    // MBTiles-Modus restaurieren
    M.source = 'mbtiles';
    img.style.display = 'none';
    hint.style.display = 'none';
    window.MBTiles.metadata().then(meta => {
      M.mbMeta = meta;
      const maxZ = meta.maxzoom ?? 14;
      M.mbWorldPx = M.mbTileSize * Math.pow(2, maxZ);
      if(tilesContainer){
        tilesContainer.style.display = 'block';
        tilesContainer.style.width = M.mbWorldPx + 'px';
        tilesContainer.style.height = M.mbWorldPx + 'px';
      }
      const svg = $('map-draw-svg');
      if(svg){
        svg.setAttribute('width', M.mbWorldPx);
        svg.setAttribute('height', M.mbWorldPx);
        svg.setAttribute('viewBox', `0 0 ${M.mbWorldPx} ${M.mbWorldPx}`);
      }
      M.zoom = S.mapZoom || 1;
      M.panX = S.mapPanX || 0;
      M.panY = S.mapPanY || 0;
      if(!S.mapZoom) resetMapView();
      applyMapTransform();
      renderMapTiles();
    }).catch(() => {
      // Falls die MBTiles-Datei nicht mehr existiert → Hinweis anzeigen
      M.source = 'png';
      S.mapSource = null;
      hint.style.display = '';
      img.style.display = 'none';
      if(tilesContainer) tilesContainer.style.display = 'none';
    });
  } else if(S.mapImage){
    // PNG-Modus
    M.source = 'png';
    img.src = S.mapImage;
    hint.style.display = 'none';
    img.style.display = 'block';
    if(tilesContainer) tilesContainer.style.display = 'none';
    M.zoom = S.mapZoom || 1;
    M.panX = S.mapPanX || 0;
    M.panY = S.mapPanY || 0;
  } else {
    // Keine Karte
    M.source = 'png';
    hint.style.display = '';
    img.style.display = 'none';
    if(tilesContainer) tilesContainer.style.display = 'none';
  }
  // Drawings wiederherstellen (egal welcher Modus)
  const svg = $('map-draw-svg');
  if(svg){
    [...svg.children].filter(c => c.tagName !== 'defs').forEach(c => c.remove());
    if(S.mapDrawings){
      const tpl = document.createElement('template');
      tpl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg">'+S.mapDrawings+'</svg>';
      const tmp = tpl.content.firstChild;
      [...tmp.children].forEach(c => svg.appendChild(c));
    }
  }
  applyMapTransform();
  bindMapHandlers();
}

function _clampMapPan(){
  const wrap = $('map-canvas-wrap');
  if(!wrap) return;
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  if(ww <= 0 || wh <= 0) return;

  if(M.source === 'mbtiles' && M.contentBounds){
    // MBTiles: Clamping auf Content-Bounds (Vorarlberg-Ausschnitt), nicht Welt-Pixel
    const {x0,y0,x1,y1} = M.contentBounds;
    const cw = x1 - x0, ch = y1 - y0;
    if(cw <= 0 || ch <= 0) return;
    // Minimum-Zoom: Content muss Viewport in beiden Richtungen füllen
    const minZoom = Math.max(ww / cw, wh / ch);
    if(M.zoom < minZoom) M.zoom = minZoom;
    // Erlaubter Pan-Bereich: Content-Bereich muss immer den Viewport abdecken
    const ox = x0 * M.zoom, oy = y0 * M.zoom;  // Offset des Content-Starts in screen-px
    const sw = cw * M.zoom, sh = ch * M.zoom;
    const maxPX = -ox;                           // kann nicht weiter rechts als Content-Anfang
    const minPX = ww - (ox + sw);               // kann nicht weiter links als Content-Ende
    const maxPY = -oy;
    const minPY = wh - (oy + sh);
    M.panX = Math.max(minPX, Math.min(maxPX, M.panX));
    M.panY = Math.max(minPY, Math.min(maxPY, M.panY));
  } else {
    // PNG-Modus oder MBTiles ohne Bounds
    let cw, ch;
    if(M.source === 'mbtiles'){ cw = ch = M.mbWorldPx; }
    else { const img = $('map-image'); cw = img ? img.naturalWidth : 0; ch = img ? img.naturalHeight : 0; }
    if(!cw || !ch) return;
    const minZoom = Math.max(ww / cw, wh / ch);
    if(M.zoom < minZoom) M.zoom = minZoom;
    const sw = cw * M.zoom, sh = ch * M.zoom;
    M.panX = sw >= ww ? Math.max(ww-sw, Math.min(0, M.panX)) : (ww-sw)/2;
    M.panY = sh >= wh ? Math.max(wh-sh, Math.min(0, M.panY)) : (wh-sh)/2;
  }
}

function applyMapTransform(){
  _clampMapPan();
  const tr = $('map-transform');
  if(tr) tr.style.transform = `translate(${M.panX}px, ${M.panY}px) scale(${M.zoom})`;
  const z = $('map-zoom-display');
  if(z) z.textContent = Math.round(M.zoom*100) + '%';
  if(M.source === 'mbtiles'){
    // Tiles neu rendern (debounced minimal via requestAnimationFrame)
    if(M._tilesRaf) cancelAnimationFrame(M._tilesRaf);
    M._tilesRaf = requestAnimationFrame(() => renderMapTiles());
  } else {
    // PNG-Modus: SVG-Größe an Bild anpassen
    const img = $('map-image');
    const svg = $('map-draw-svg');
    if(img && svg && img.naturalWidth){
      svg.setAttribute('width', img.naturalWidth);
      svg.setAttribute('height', img.naturalHeight);
      svg.setAttribute('viewBox', `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
    }
  }
}

function mapZoomBy(factor){
  const wrap = $('map-canvas-wrap');
  if(!wrap) return;
  const r = wrap.getBoundingClientRect();
  // Zoom in Richtung Wrap-Mitte
  const cx = r.width/2, cy = r.height/2;
  const newZoom = Math.max(0.1, Math.min(20, M.zoom * factor));
  // Punkt unter Wrap-Mitte fixieren
  const px = (cx - M.panX) / M.zoom;
  const py = (cy - M.panY) / M.zoom;
  M.zoom = newZoom;
  M.panX = cx - px * M.zoom;
  M.panY = cy - py * M.zoom;
  applyMapTransform();
}

function resetMapView(){
  const wrap = $('map-canvas-wrap');
  if(!wrap) return;
  const r = wrap.getBoundingClientRect();
  if(M.source === 'mbtiles'){
    // Auf die ganze Welt einpassen (oder bounds, falls vorhanden)
    if(M.mbMeta && M.mbMeta.bounds){
      // bounds = "west,south,east,north" in WGS84-Grad, wir mappen auf Pixel-Koordinaten
      const [w, s, e, n] = M.mbMeta.bounds.split(',').map(parseFloat);
      const maxZ = M.mbMeta.maxzoom ?? 14;
      const tilesAtMax = Math.pow(2, maxZ);
      const totalPx = M.mbTileSize * tilesAtMax;
      const x0 = ((w + 180) / 360) * totalPx;
      const x1 = ((e + 180) / 360) * totalPx;
      // Mercator-Y für Lat (vereinfacht)
      const latRadN = n * Math.PI / 180;
      const latRadS = s * Math.PI / 180;
      const y0 = (1 - Math.log(Math.tan(latRadN) + 1/Math.cos(latRadN)) / Math.PI) / 2 * totalPx;
      const y1 = (1 - Math.log(Math.tan(latRadS) + 1/Math.cos(latRadS)) / Math.PI) / 2 * totalPx;
      const boundsW = x1 - x0, boundsH = y1 - y0;
        // Content-Bounds für Clamping speichern
      M.contentBounds = {x0, y0, x1, y1};
      // Zoom: Content FÜLLT Viewport (kein Padding → kein schwarzer Rand)
      M.zoom = Math.max(r.width / boundsW, r.height / boundsH);
      M.panX = (r.width  - boundsW * M.zoom)/2 - x0 * M.zoom;
      M.panY = (r.height - boundsH * M.zoom)/2 - y0 * M.zoom;
    } else {
      // Fallback: ganze Welt einpassen
      M.zoom = Math.min(r.width, r.height) / M.mbWorldPx * 0.95;
      M.panX = (r.width  - M.mbWorldPx * M.zoom) / 2;
      M.panY = (r.height - M.mbWorldPx * M.zoom) / 2;
    }
    applyMapTransform();
    renderMapTiles();
    return;
  }
  // PNG-Modus: Bild einpassen
  const img = $('map-image');
  if(!img || !img.naturalWidth) return;
  const fitX = r.width / img.naturalWidth;
  const fitY = r.height / img.naturalHeight;
  M.zoom = Math.max(fitX, fitY);
  M.panX = (r.width - img.naturalWidth * M.zoom) / 2;
  M.panY = (r.height - img.naturalHeight * M.zoom) / 2;
  applyMapTransform();
}

function handleMapUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    // MBTiles-Modus verlassen, falls aktiv
    if(M.source === 'mbtiles') _clearMBTiles();
    M.source = 'png';
    M.mbMeta = null;
    S.mapSource = 'png';
    S.mapImage = ev.target.result;
    S.mapDrawings = ''; // bei neuer Karte: alte Annotationen löschen
    S.mapZoom = 1; S.mapPanX = 0; S.mapPanY = 0;
    scheduleSave();
    const img = $('map-image');
    const hint = $('map-empty-hint');
    if(img && hint){
      img.src = S.mapImage;
      hint.style.display = 'none';
      img.style.display = 'block';
      img.onload = () => {
        applyMapTransform();
        resetMapView();
      };
    }
    // Alte Annotationen aus DOM entfernen
    const svg = $('map-draw-svg');
    if(svg) [...svg.children].filter(c => c.tagName !== 'defs').forEach(c => c.remove());
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

let _mapHandlersBound = false;
function bindMapHandlers(){
  if(_mapHandlersBound) return;
  _mapHandlersBound = true;
  const wrap = $('map-canvas-wrap');
  if(!wrap) return;

  // Mausrad-Zoom — zentriert um Cursor-Position
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    const newZoom = Math.max(0.1, Math.min(20, M.zoom * factor));
    const px = (cx - M.panX) / M.zoom;
    const py = (cy - M.panY) / M.zoom;
    M.zoom = newZoom;
    M.panX = cx - px * M.zoom;
    M.panY = cy - py * M.zoom;
    applyMapTransform();
  }, {passive:false});

  // Pinch-to-Zoom + Pan via Touch
  const _mapPointers = new Map();
  let _mapPinchStartDist = null, _mapPinchStartZoom = 1, _mapPinchCenter = null;

  // Cursor je nach aktivem Werkzeug aktualisieren
  function _updateMapCursor(){
    const wrap2 = $('map-canvas-wrap');
    if(!wrap2) return;
    wrap2.style.cursor = DRAW_TOOLS.includes(S.tool) ? 'crosshair' : 'grab';
  }
  // Bei Tool-Wechsel Cursor neu setzen
  const _origSetTool = window._mapSetToolHook;
  document.addEventListener('map-tool-change', _updateMapCursor);

  wrap.addEventListener('pointerdown', e => {
    if(e.target.closest('button,a,input')) return;
    wrap.setPointerCapture(e.pointerId);
    _mapPointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(_mapPointers.size === 2){
      // Pinch-Start
      const pts = [..._mapPointers.values()];
      const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
      _mapPinchStartDist = Math.hypot(dx, dy);
      _mapPinchStartZoom = M.zoom;
      const r = wrap.getBoundingClientRect();
      _mapPinchCenter = {
        x: (pts[0].x + pts[1].x)/2 - r.left,
        y: (pts[0].y + pts[1].y)/2 - r.top
      };
      M.isPanning = false;
      M.isDrawing = false;
      return;
    }

    if(_mapPointers.size === 1){
      const isDrawTool = DRAW_TOOLS.includes(S.tool);
      // Zeichnen erlauben wenn PNG geladen ODER MBTiles aktiv
      if(isDrawTool && (S.mapImage || M.source === 'mbtiles')){
        // Zeichnen starten — Koordinaten in Bild-Pixel umrechnen
        startMapDraw(e);
      } else {
        // Pan-Modus
        M.isPanning = true;
        M.panStart = {x: e.clientX - M.panX, y: e.clientY - M.panY};
        wrap.style.cursor = 'grabbing';
      }
    }
  });

  wrap.addEventListener('pointermove', e => {
    if(!_mapPointers.has(e.pointerId)) return;
    _mapPointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(_mapPointers.size === 2 && _mapPinchStartDist !== null){
      // Pinch-Zoom
      const pts = [..._mapPointers.values()];
      const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
      const dist = Math.hypot(dx, dy);
      const newZoom = Math.max(0.1, Math.min(20, _mapPinchStartZoom * (dist / _mapPinchStartDist)));
      const cx = _mapPinchCenter.x, cy = _mapPinchCenter.y;
      const px = (cx - M.panX) / M.zoom;
      const py = (cy - M.panY) / M.zoom;
      M.zoom = newZoom;
      M.panX = cx - px * M.zoom;
      M.panY = cy - py * M.zoom;
      applyMapTransform();
      return;
    }

    if(M.isDrawing){
      moveMapDraw(e);
    } else if(M.isPanning){
      M.panX = e.clientX - M.panStart.x;
      M.panY = e.clientY - M.panStart.y;
      applyMapTransform();
    }
  });

  const endHandler = e => {
    if(_mapPointers.has(e.pointerId)) _mapPointers.delete(e.pointerId);
    try{ wrap.releasePointerCapture(e.pointerId); }catch(_){}
    if(_mapPointers.size < 2){ _mapPinchStartDist = null; }
    if(M.isDrawing) endMapDraw(e);
    M.isPanning = false;
    wrap.style.cursor = 'grab';
  };
  wrap.addEventListener('pointerup', endHandler);
  wrap.addEventListener('pointercancel', endHandler);
}

// Koordinaten von Screen → Bild-Pixel
function _mapScreenToImg(e){
  const wrap = $('map-canvas-wrap');
  const r = wrap.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  return { x: (sx - M.panX) / M.zoom, y: (sy - M.panY) / M.zoom };
}

function placeMapText(e){
  const wrap=$('map-canvas-wrap'); if(!wrap)return;
  const p=_mapScreenToImg(e);
  const r=wrap.getBoundingClientRect();
  const existing=document.getElementById('map-text-inp');if(existing)existing.remove();
  const inp=document.createElement('div');
  inp.id='map-text-inp';inp.contentEditable='true';
  const fontSize=Math.max(12,(S.strokeWidth||2)*8);
  inp.style.cssText=`position:absolute;z-index:25;left:${e.clientX-r.left}px;top:${e.clientY-r.top}px;`+
    `min-width:8px;outline:none;color:${S.strokeColor||'#fff'};font-size:${fontSize}px;`+
    `font-family:var(--mono);background:rgba(0,0,0,.25);border:1px dashed rgba(255,255,255,.4);`+
    `padding:2px 5px;cursor:text;white-space:nowrap;border-radius:3px;`;
  wrap.appendChild(inp);inp.focus();
  function commitMapText(){
    const text=inp.innerText.trim(); inp.remove();
    if(!text)return;
    const svg=$('map-draw-svg');if(!svg)return;
    const el=document.createElementNS('http://www.w3.org/2000/svg','text');
    el.setAttribute('x',p.x);el.setAttribute('y',p.y);
    el.setAttribute('fill',S.strokeColor||'#ff6060');
    el.setAttribute('font-size',fontSize/M.zoom);
    el.setAttribute('font-family','monospace');
    el.setAttribute('dominant-baseline','hanging');
    el.textContent=text;
    svg.appendChild(el);
    S.mapDrawings=[...svg.children].filter(c=>c.tagName!=='defs').map(c=>c.outerHTML).join('');
    scheduleSave();
  }
  inp.addEventListener('blur',commitMapText);
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();commitMapText();}
    if(ev.key==='Escape'){inp.remove();}
    ev.stopPropagation();
  });
}

function startMapDraw(e){
  const svg = $('map-draw-svg');
  if(!svg) return;
  if(S.tool==='text'){placeMapText(e);M.isDrawing=false;return;}
  const p = _mapScreenToImg(e);
  M.isDrawing = true;
  M._drawStart = p;
  const stroke = S.strokeColor || '#ff6060';
  const sw = (S.strokeWidth || 2);
  let el;
  if(S.tool === 'pen'){
    el = document.createElementNS('http://www.w3.org/2000/svg','path');
    el.setAttribute('d', `M${p.x},${p.y}`);
    el.setAttribute('stroke', stroke);
    el.setAttribute('stroke-width', sw);
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke-linecap', 'round');
    el.setAttribute('stroke-linejoin', 'round');
  } else if(S.tool === 'line'){
    el = document.createElementNS('http://www.w3.org/2000/svg','line');
    el.setAttribute('x1', p.x); el.setAttribute('y1', p.y);
    el.setAttribute('x2', p.x); el.setAttribute('y2', p.y);
    el.setAttribute('stroke', stroke);
    el.setAttribute('stroke-width', sw);
    el.setAttribute('stroke-linecap', 'round');
  } else if(S.tool === 'arrow'){
    el = document.createElementNS('http://www.w3.org/2000/svg','line');
    el.setAttribute('x1', p.x); el.setAttribute('y1', p.y);
    el.setAttribute('x2', p.x); el.setAttribute('y2', p.y);
    el.setAttribute('stroke', stroke);
    el.setAttribute('stroke-width', sw);
    el.setAttribute('stroke-linecap', 'round');
    // Arrowhead-Marker für die Karten-SVG sicherstellen
    const defs = svg.querySelector('defs');
    if(defs){
      const id = 'map-ah-'+stroke.replace('#','');
      if(!defs.querySelector('#'+id.replace(/[^a-z0-9-]/gi,''))){
        const m = document.createElementNS('http://www.w3.org/2000/svg','marker');
        m.setAttribute('id', id.replace(/[^a-z0-9-]/gi,''));
        m.setAttribute('markerWidth','10'); m.setAttribute('markerHeight','10');
        m.setAttribute('refX','8'); m.setAttribute('refY','3');
        m.setAttribute('orient','auto');
        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d','M0,0 L0,6 L9,3 z');
        path.setAttribute('fill', stroke);
        m.appendChild(path);
        defs.appendChild(m);
      }
      el.setAttribute('marker-end', `url(#${id.replace(/[^a-z0-9-]/gi,'')})`);
    }
  } else if(S.tool === 'rect'){
    el = document.createElementNS('http://www.w3.org/2000/svg','rect');
    el.setAttribute('x', p.x); el.setAttribute('y', p.y);
    el.setAttribute('width', 0); el.setAttribute('height', 0);
    el.setAttribute('stroke', stroke);
    el.setAttribute('stroke-width', sw);
    el.setAttribute('fill', 'none');
  } else if(S.tool === 'circle'){
    el = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    el.setAttribute('cx', p.x); el.setAttribute('cy', p.y);
    el.setAttribute('rx', 0); el.setAttribute('ry', 0);
    el.setAttribute('stroke', stroke);
    el.setAttribute('stroke-width', sw);
    el.setAttribute('fill', 'none');
  } else if(S.tool === 'eraser'){
    M.isDrawing = false;
    eraseMapAt(p);
    return;
  } else {
    M.isDrawing = false;
    return;
  }
  svg.appendChild(el);
  M.drawEl = el;
}

function moveMapDraw(e){
  if(!M.drawEl) return;
  const p = _mapScreenToImg(e);
  const tag = M.drawEl.tagName.toLowerCase();
  if(tag === 'path'){
    const d = M.drawEl.getAttribute('d');
    M.drawEl.setAttribute('d', d + ` L${p.x},${p.y}`);
  } else if(tag === 'line'){
    M.drawEl.setAttribute('x2', p.x);
    M.drawEl.setAttribute('y2', p.y);
  } else if(tag === 'rect'){
    const sx = M._drawStart.x, sy = M._drawStart.y;
    M.drawEl.setAttribute('x', Math.min(sx, p.x));
    M.drawEl.setAttribute('y', Math.min(sy, p.y));
    M.drawEl.setAttribute('width', Math.abs(p.x - sx));
    M.drawEl.setAttribute('height', Math.abs(p.y - sy));
  } else if(tag === 'ellipse'){
    const sx = M._drawStart.x, sy = M._drawStart.y;
    M.drawEl.setAttribute('cx', (sx + p.x)/2);
    M.drawEl.setAttribute('cy', (sy + p.y)/2);
    M.drawEl.setAttribute('rx', Math.abs(p.x - sx)/2);
    M.drawEl.setAttribute('ry', Math.abs(p.y - sy)/2);
  }
}

function endMapDraw(e){
  M.isDrawing = false;
  M.drawEl = null;
  // Persistieren
  const svg = $('map-draw-svg');
  if(svg){
    const inner = [...svg.children].filter(c => c.tagName !== 'defs').map(c => c.outerHTML).join('');
    S.mapDrawings = inner;
    scheduleSave();
  }
}

function eraseMapAt(p){
  const svg = $('map-draw-svg');
  if(!svg) return;
  // Hit-Test mit kleinem Radius
  const r = 8 / M.zoom;
  [...svg.children].forEach(el => {
    if(el.tagName === 'defs') return;
    const bb = el.getBBox();
    if(p.x >= bb.x - r && p.x <= bb.x + bb.width + r &&
       p.y >= bb.y - r && p.y <= bb.y + bb.height + r){
      el.remove();
    }
  });
  // Persistieren
  const inner = [...svg.children].filter(c => c.tagName !== 'defs').map(c => c.outerHTML).join('');
  S.mapDrawings = inner;
  scheduleSave();
}

function getItemIcon(item){
  if(item.type==='note') return '🗒';
  if(item.type==='folder') return '📁';
  if(item.type==='file') return '📄';
  if(item.type==='image') return '🖼';
  if(item.type==='text-label') return '🔤';

}
function getItemName(item){
  if(item.type==='text-label') return item.text||'Text';
  if(item.type==='note') return item.text?(item.text.slice(0,22)+(item.text.length>22?'…':'')):'Notiz';
  return item.name||item.type||'Element';
}
function getDrawingIcon(el){
  const t=el.tagName.toLowerCase();
  if(t==='path') return '✏️';
  if(t==='line') return '╱';
  if(t==='rect') return '▭';
  if(t==='ellipse'||t==='circle') return '○';
  return '◇';
}
function getDrawingName(el){
  const t=el.tagName.toLowerCase();
  const col=(el.getAttribute('stroke')||'').slice(0,7);
  if(t==='path') return 'Strich '+col;
  if(t==='line') return 'Linie '+col;
  if(t==='rect') return 'Rechteck '+col;
  if(t==='ellipse'||t==='circle') return 'Ellipse '+col;
  return 'Zeichnung';
}

// ── Mouse-based drag for layer items ──
let _layerDrag=null; // {data, ghost, startY, startX}
function _startLayerItemDrag(e,data,labelText){
  e.preventDefault();e.stopPropagation();
  const ghost=document.createElement('div');
  ghost.style.cssText='position:fixed;z-index:9999;background:var(--surface2);border:1px solid var(--accent);border-radius:5px;padding:4px 10px;font-size:10px;font-family:var(--mono);color:var(--accent);pointer-events:none;opacity:.9;white-space:nowrap;';
  ghost.textContent=labelText;
  document.body.appendChild(ghost);
  const _gx=e.touches?e.touches[0].clientX:e.clientX;
  const _gy=e.touches?e.touches[0].clientY:e.clientY;
  ghost.style.left=_gx+12+'px';ghost.style.top=_gy-10+'px';
  _layerDrag={data,ghost};
  const onMove=ev=>{
    ghost.style.left=ev.clientX+12+'px';ghost.style.top=ev.clientY-10+'px';
    document.querySelectorAll('.layer-row,.layer-item-row,.layer-items-list').forEach(el=>{
      const r=el.getBoundingClientRect();
      const over=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom;
      el.style.outline=over?'1px solid var(--accent)':'';
    });
  };
  const onUp=ev=>{
    ghost.remove();_layerDrag=null;
    window.removeEventListener('pointermove',onMove);
    window.removeEventListener('pointerup',onUp);
    window.removeEventListener('pointercancel',onUp);
    document.querySelectorAll('.layer-row,.layer-item-row,.layer-items-list').forEach(el=>el.style.outline='');
    // Find drop target row
    const hits=document.elementsFromPoint(ev.clientX,ev.clientY);
    const targetEl=hits.find(el=>
      el.classList.contains('layer-item-row')||
      el.classList.contains('layer-row')||
      el.classList.contains('layer-items-list')
    );
    if(!targetEl) return;
    const toLayerId=+(targetEl.dataset.layerId);
    if(!toLayerId) return;
    // Target item (for reordering within layer)
    const toItemId=targetEl.dataset.itemId!=null ? +targetEl.dataset.itemId : null;
    const toDid=targetEl.dataset.did||null;

    if(data.itemId!=null){
      const it=S.items.find(x=>x.id===data.itemId);
      if(!it) return;
      if(it.layerId===toLayerId && toItemId!=null && toItemId!==data.itemId){
        // Reorder innerhalb der Ebene:
        // Liste zeigt oben = höchstes z. Droppen AUF ein Element
        // bedeutet: dragged Item bekommt z des Ziel-Items,
        // Ziel und alles dazwischen wird um 1 verschoben.
        const toItem=S.items.find(x=>x.id===toItemId);
        if(toItem){
          const fromZ=it.z||1;
          const toZ=toItem.z||1;
          const layerItems=S.items.filter(x=>x.layerId===toLayerId);
          if(fromZ>toZ){
            // Nach unten verschieben: alles zwischen toZ und fromZ um +1
            layerItems.forEach(x=>{
              if((x.z||1)>=toZ&&(x.z||1)<fromZ&&x.id!==it.id) x.z=(x.z||1)+1;
            });
          } else {
            // Nach oben verschieben: alles zwischen fromZ und toZ um -1
            layerItems.forEach(x=>{
              if((x.z||1)>fromZ&&(x.z||1)<=toZ&&x.id!==it.id) x.z=(x.z||1)-1;
            });
          }
          it.z=toZ;
          applyLayerOrder();
        }
      } else if(it.layerId!==toLayerId){
        // Move to different layer
        it.layerId=toLayerId;
        renderItem(it);
        applyLayerOrder();
      }
    } else if(data.did){
      const el=S.drawings.find(x=>x.dataset.did===data.did);
      if(el){
        el.setAttribute('data-lid',toLayerId);
        ensureLayerSvg(toLayerId).appendChild(el);
      }
    }
    renderLayerList();scheduleSave();
  };
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
}

let _layerListDirty = false;
let _layerListRaf = null;
function scheduleRenderLayerList(){
  if(_layerListRaf) return;
  if(!$('layer-panel')?.classList.contains('open')) return; // Panel zu → skip
  _layerListRaf = requestAnimationFrame(()=>{_layerListRaf=null;renderLayerList();});
}
function renderLayerList(){
  if(!$('layer-panel')?.classList.contains('open')) return; // Panel zu → kein DOM-Rebuild
  const list=$('layer-list');if(!list)return;
  list.innerHTML='';
  S.drawings.forEach((el,i)=>{if(!el.dataset.did) el.dataset.did='d'+i+'_'+Date.now();});

  [...S.layers].reverse().forEach((layer,ri)=>{
    const i=S.layers.length-1-ri;
    const isActive=layer.id===S.activeLayerId;
    const layerItems=S.items.filter(it=>it.layerId===layer.id);
    const layerDrawings=S.drawings.filter(el=>el.getAttribute&&String(el.getAttribute('data-lid'))===String(layer.id));
    const totalCount=layerItems.length+layerDrawings.length;
    const expanded=layer._expanded!==false;

    // ── Layer row ──
    const row=document.createElement('div');
    row.className='layer-row'+(isActive?' active-layer':'')+(layer.locked?' locked':'');
    row.dataset.layerId=layer.id; // for drag drop target

    const expandBtn=document.createElement('button');
    expandBtn.className='layer-expand-btn';
    expandBtn.textContent=expanded?'▾':'▸';
    expandBtn.addEventListener('click',e=>{e.stopPropagation();layer._expanded=!expanded;renderLayerList();});

    const visBtn=document.createElement('button');
    visBtn.className='layer-icon-btn';visBtn.title='Sichtbarkeit';
    visBtn.textContent=layer.visible!==false?'👁':'🚫';
    visBtn.addEventListener('click',e=>{
      e.stopPropagation();layer.visible=layer.visible===false?true:false;
      S.items.filter(it=>it.layerId===layer.id).forEach(it=>{
        const el=$('item-'+it.id);if(el)el.style.display=layer.visible===false?'none':'';
      });
      const lsvg=document.getElementById('layer-svg-'+layer.id);
      if(lsvg)lsvg.style.display=layer.visible===false?'none':'';
      renderLayerList();scheduleSave();
    });

    const lockBtn=document.createElement('button');
    lockBtn.className='layer-icon-btn';lockBtn.title='Sperren';
    lockBtn.textContent=layer.locked?'🔒':'🔓';
    lockBtn.addEventListener('click',e=>{
      e.stopPropagation();
      layer.locked=!layer.locked;
      S.items.filter(it=>it.layerId===layer.id).forEach(it=>{
        const el=$('item-'+it.id);
        if(!el) return;
        if(layer.locked){
          el.style.pointerEvents='none';
          el.querySelectorAll('button,a,textarea,input,select,video').forEach(c=>{c.style.pointerEvents='none';});
        } else {
          el.style.pointerEvents='';
          el.querySelectorAll('button,a,textarea,input,select,video').forEach(c=>{c.style.pointerEvents='';});
        }
      });
      const lsvg=document.getElementById('layer-svg-'+layer.id);
      if(lsvg){
        lsvg.querySelectorAll(':scope > *:not(defs)').forEach(sh=>{
          if(layer.locked) sh.classList.add('layer-locked-shape');
          else sh.classList.remove('layer-locked-shape');
        });
      }
      if(layer.locked && S.selectedIds.size>0){
        const toDeselect=[...S.selectedIds].filter(id=>{
          const it=S.items.find(i=>i.id===id);
          return it && it.layerId===layer.id;
        });
        toDeselect.forEach(id=>{
          S.selectedIds.delete(id);
          $('item-'+id)?.classList.remove('selected');
        });
      }
      renderLayerList();
      scheduleSave();
    });

    const nameEl=document.createElement('span');
    nameEl.className='layer-name';nameEl.textContent=layer.name;
    nameEl.addEventListener('dblclick',e=>{
      e.stopPropagation();nameEl.contentEditable='true';nameEl.focus();
      window.getSelection().selectAllChildren(nameEl);
      nameEl.addEventListener('keydown',ev=>{ev.stopPropagation();if(ev.key==='Enter'){ev.preventDefault();nameEl.blur();}},{once:true});
      nameEl.addEventListener('blur',()=>{nameEl.contentEditable='false';layer.name=nameEl.textContent.trim()||layer.name;nameEl.textContent=layer.name;scheduleSave();},{once:true});
    });

    const badge=document.createElement('span');
    badge.style.cssText='font-size:9px;color:var(--text-dim);font-family:var(--mono);opacity:.6;margin-left:2px;';
    badge.textContent=totalCount?`(${totalCount})`:'';

    const upBtn=document.createElement('button');upBtn.className='layer-icon-btn';upBtn.textContent='↑';upBtn.title='Nach oben';
    upBtn.addEventListener('click',e=>{e.stopPropagation();if(i<S.layers.length-1){[S.layers[i],S.layers[i+1]]=[S.layers[i+1],S.layers[i]];renderLayerList();applyLayerOrder();scheduleSave();}});
    const dnBtn=document.createElement('button');dnBtn.className='layer-icon-btn';dnBtn.textContent='↓';dnBtn.title='Nach unten';
    dnBtn.addEventListener('click',e=>{e.stopPropagation();if(i>0){[S.layers[i],S.layers[i-1]]=[S.layers[i-1],S.layers[i]];renderLayerList();applyLayerOrder();scheduleSave();}});

    const delBtn=document.createElement('button');delBtn.className='layer-icon-btn';delBtn.textContent='🗑';delBtn.title='Ebene löschen';
    delBtn.style.opacity=S.layers.length>1?'1':'0.2';
    delBtn.addEventListener('click',e=>{
      e.stopPropagation();if(S.layers.length<=1)return;
      const fallback=S.layers.find(l=>l.id!==layer.id);
      S.items.filter(it=>it.layerId===layer.id).forEach(it=>it.layerId=fallback.id);
      S.drawings.filter(el=>String(el.getAttribute('data-lid'))===String(layer.id))
        .forEach(el=>{el.setAttribute('data-lid',fallback.id);ensureLayerSvg(fallback.id).appendChild(el);});
      S.layers.splice(i,1);
      if(S.activeLayerId===layer.id)S.activeLayerId=fallback.id;
      const svg=document.getElementById('layer-svg-'+layer.id);if(svg)svg.remove();
      renderLayerList();applyLayerOrder();scheduleSave();
    });

    row.addEventListener('click',()=>{S.activeLayerId=layer.id;renderLayerList();});
    row.appendChild(expandBtn);row.appendChild(visBtn);row.appendChild(lockBtn);
    row.appendChild(nameEl);row.appendChild(badge);
    row.appendChild(upBtn);row.appendChild(dnBtn);row.appendChild(delBtn);
    list.appendChild(row);

    // ── Item sub-list ──
    const itemList=document.createElement('div');
    itemList.className='layer-items-list'+(expanded?' open':'');
    itemList.dataset.layerId=layer.id;

    function makeItemRow(icon,name,dragData,onClick){
      const ir=document.createElement('div');
      ir.className='layer-item-row';
      ir.dataset.layerId=layer.id;
      // Store item/drawing id for drop target identification
      if(dragData.itemId!=null) ir.dataset.itemId=dragData.itemId;
      if(dragData.did) ir.dataset.did=dragData.did;
      const dh=document.createElement('span');dh.className='layer-item-drag';dh.textContent='⠿';
      dh.style.cursor='grab';
      const ic=document.createElement('span');ic.className='layer-item-icon';ic.textContent=icon;
      const nm=document.createElement('span');nm.className='layer-item-name';nm.textContent=name;
      ir.appendChild(dh);ir.appendChild(ic);ir.appendChild(nm);
      // Pointer drag on handle (Maus + Touch + Stift)
      dh.addEventListener('pointerdown',e=>{
        e.stopPropagation();
        e.preventDefault();
        _startLayerItemDrag(e,dragData,icon+' '+name);
      });
      if(onClick) ir.addEventListener('click',e=>{
        if(e.target===dh) return;
        e.stopPropagation();onClick();
      });
      // Trash button
      const trash=document.createElement('button');
      trash.style.cssText='background:none;border:none;cursor:pointer;font-size:10px;opacity:.4;padding:0 2px;color:var(--text-dim);margin-left:auto;flex-shrink:0;';
      trash.textContent='🗑';
      trash.title='Löschen';
      trash.addEventListener('mousedown',e=>e.stopPropagation());
      trash.addEventListener('click',e=>{
        e.stopPropagation();
        if(dragData.itemId!=null) deleteItem(dragData.itemId);
        else if(dragData.did){
          const el=S.drawings.find(x=>x.dataset.did===dragData.did);
          if(el){const i=S.drawings.indexOf(el);if(i!==-1)S.drawings.splice(i,1);el.remove();}
          renderLayerList();scheduleSave();
        }
      });
      ir.appendChild(trash);
      return ir;
    }

    // Items sorted by z desc
    [...layerItems].sort((a,b)=>((b.z||0)-(a.z||0))).forEach(item=>{
      const ir=makeItemRow(
        getItemIcon(item), getItemName(item),
        {itemId:item.id},
        ()=>{clearSelection();const el=$('item-'+item.id);if(el){state_selectedAdd(item.id,el);bringToFront(item);}setTool('select');renderLayerList();}
      );
      if(S.selectedIds.has(item.id)) ir.classList.add('selected-item');
      itemList.appendChild(ir);
    });

    // SVG-Positions-Toggle: über oder unter Items
    if(layerDrawings.length>0){
      const svgToggleRow=document.createElement('div');
      svgToggleRow.style.cssText='display:flex;align-items:center;gap:6px;padding:3px 6px 3px 22px;font-size:9px;font-family:var(--mono);color:var(--text-dimmer);border-bottom:1px solid rgba(255,255,255,.03);';
      const isOver=(layer._svgZ==null||layer._svgZ>=800);

}

function applyLayerOrder(){
  const drawingActive=DRAW_TOOLS.includes(S.tool);
  S.layers.forEach((layer,i)=>{
    S.items.filter(it=>it.layerId===layer.id).forEach(it=>{
      const el=$('item-'+it.id);
      if(el){
        const isSelected=S.selectedIds.has(it.id);
        if(it.type==='folder'){
          // Ordner respektieren die Layer-Reihenfolge (nicht mehr auf 0 gezwungen)
          const fz=String((i+1)*1000+(it.z||1)+(isSelected?500:0));
          if(el.style.zIndex!==fz) el.style.zIndex=fz;
        } else if(it.type==='file'&&!isSelected){
          if(el.style.zIndex!=='3') el.style.zIndex='3';
        } else {
          const z=String((i+1)*1000+(it.z||1)+(isSelected?500:0));
          if(el.style.zIndex!==z) el.style.zIndex=z;

      }
    });
    const svg=document.getElementById('layer-svg-'+layer.id);
    if(svg&&svg.style.zIndex!=='99999') svg.style.zIndex='99999';

  // draw-layers: nur DOM-Move wenn nötig (verhindert Reflow)
  const dl=$('draw-layers');

    if(cvs.lastElementChild!==dl) cvs.appendChild(dl);
  }
}

// ══════════════════════════════════════════════════════
// IndexedDB — Large file storage (images, PDFs, etc.)
// ══════════════════════════════════════════════════════
const IDB_NAME = 'boarddesk_files';
const IDB_STORE = 'files';
let _idb = null;

function idbOpen(){
  return new Promise((res,rej)=>{
    if(_idb){res(_idb);return;}
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE))
        db.createObjectStore(IDB_STORE);
    };
    req.onsuccess=e=>{_idb=e.target.result;res(_idb);};
    req.onerror=()=>rej(req.error);
  });
}
function idbPut(key,value){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(value,key);
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);
  }));
}
function idbGet(key){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const req=tx.objectStore(IDB_STORE).get(key);
    req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);
  }));
}
function idbDeleteKeys(keys){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    const store=tx.objectStore(IDB_STORE);
    keys.forEach(k=>store.delete(k));
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);
  }));
}
function idbGetAllKeys(){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const req=tx.objectStore(IDB_STORE).getAllKeys();
    req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);
  }));
}

// Extract all fileData/src from board data, store in IDB, replace with ref key
// Works on a DEEP CLONE so S.items is never mutated
function captureBoardAsync(){
  const board = captureBoard();
  const writes = [];
  const usedKeys = new Set();

  // Reuse stable IDB keys from the live items (by id lookup)
  function getStableKey(liveItem, suffix){
    if(!liveItem) return suffix+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    if(!liveItem._idbKey) liveItem._idbKey = suffix+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    return liveItem._idbKey;
  }

  // ZUERST: große Daten aus items herausziehen und durch idb:-Keys ersetzen
  // Danach erst JSON.stringify (verhindert RangeError bei großen Dateien)
  board.items.forEach(item=>{
    const liveItem = S.items.find(x=>x.id===item.id);
    if(item.fileData && isVideo(item.name||'')){
      item.fileData = '__video_session_only__';
    } else if(item.fileData && !item.fileData.startsWith('idb:')){
      const key = 'idb:' + getStableKey(liveItem, 'f');
      if(liveItem) liveItem._idbKey = key.slice(4);
      writes.push(idbPut(key, item.fileData));
      item.fileData = key; // ersetzen VOR deep clone
      usedKeys.add(key);
    } else if(item.fileData && item.fileData.startsWith('idb:')){
      usedKeys.add(item.fileData);
    }
    if(item.src && item.src.startsWith('data:')){
      const key = 'idb:' + getStableKey(liveItem, 'i');
      if(liveItem) liveItem._idbKey = key.slice(4);
      writes.push(idbPut(key, item.src));
      item.src = key; // ersetzen VOR deep clone
      usedKeys.add(key);
    } else if(item.src && item.src.startsWith('idb:')){
      usedKeys.add(item.src);
    }
  });

  // Jetzt erst deep clone — items enthalten nur noch kurze idb:-Keys, kein base64 mehr
  board.items = JSON.parse(JSON.stringify(board.items));
  // Folder-Kinder: fileData ebenfalls in IDB auslagern
  board.items.forEach((item)=>{
    const liveItem = S.items.find(x=>x.id===item.id);
    if(item.children) item.children.forEach((ch,ci)=>{
      const liveCh = liveItem && liveItem.children && liveItem.children[ci];
      if(ch.fileData && !ch.fileData.startsWith('idb:')){
        const key = 'idb:' + getStableKey(liveCh, 'c');
        if(liveCh) liveCh._idbKey = key.slice(4);
        writes.push(idbPut(key, ch.fileData));
        ch.fileData = key;
        usedKeys.add(key);
      } else if(ch.fileData) usedKeys.add(ch.fileData);
    });
  });
  // bgImage
  if(board.bgImage && board.bgImage.startsWith('data:')){
    const key = 'idb:bg_'+(S._bgIdbKey||(S._bgIdbKey=Date.now().toString(36)));
    writes.push(idbPut(key, board.bgImage));
    board.bgImage = key;
    usedKeys.add(key);
  } else if(board.bgImage && board.bgImage.startsWith('idb:')) usedKeys.add(board.bgImage);

  return Promise.all(writes).then(()=>({board, usedKeys}));
}

// Restore IDB refs → actual data
function restoreBoardDataAsync(data){
  // Collect all IDB keys in this board
  const keys = new Set();
  function collectKeys(item){
    if(item.fileData && item.fileData.startsWith('idb:')) keys.add(item.fileData);
    if(item.src && item.src.startsWith('idb:')) keys.add(item.src);
    if(item.children) item.children.forEach(ch=>{
      if(ch.fileData && ch.fileData.startsWith('idb:')) keys.add(ch.fileData);
    });
  }
  (data.items||[]).forEach(collectKeys);
  if(data.bgImage && data.bgImage.startsWith('idb:')) keys.add(data.bgImage);
  if(keys.size===0) return Promise.resolve(data);
  // Fetch all at once
  return Promise.all([...keys].map(k=>idbGet(k).then(v=>({k,v})))).then(results=>{
    const map={};results.forEach(({k,v})=>{if(v)map[k]=v;});
    function rehydrateItem(item){
      if(item.fileData && map[item.fileData]) item.fileData=map[item.fileData];
      if(item.src && map[item.src]) item.src=map[item.src];
      if(item.children) item.children.forEach(ch=>{
        if(ch.fileData && map[ch.fileData]) ch.fileData=map[ch.fileData];
      });
    }
    (data.items||[]).forEach(rehydrateItem);
    if(data.bgImage && map[data.bgImage]) data.bgImage=map[data.bgImage];
    return data;
  });
}

// Clean up orphaned IDB entries (keys not referenced by any board)
function cleanupIdbOrphans(){
  idbGetAllKeys().then(allKeys=>{
    const store = loadStorage()||{boards:[]};
    const used = new Set();
    store.boards.forEach(b=>{
      (b.items||[]).forEach(it=>{
        if(it.fileData && it.fileData.startsWith('idb:')) used.add(it.fileData);
        if(it.src && it.src.startsWith('idb:')) used.add(it.src);
        (it.children||[]).forEach(ch=>{if(ch.fileData && ch.fileData.startsWith('idb:')) used.add(ch.fileData);});
      });
      if(b.bgImage && b.bgImage.startsWith('idb:')) used.add(b.bgImage);
    });
    const orphans=allKeys.filter(k=>!used.has(k));
    if(orphans.length) idbDeleteKeys(orphans);
  }).catch(()=>{});
}

const STORAGE_KEY = 'boarddesk_v1';
let _saveTimer = null;
let _boardPanelOpen = false;

// ── Serialise SVG drawings to string ──
function serializeDrawings(){
  // Serialize all per-layer SVGs + legacy draw-layer
  const result={};
  (S.layers||[]).forEach(l=>{
    const svg=document.getElementById('layer-svg-'+l.id);
    if(svg) result[l.id]=svg.innerHTML;
  });
  result._legacy=drawLayer.innerHTML;
  return JSON.stringify(result);
}
function deserializeDrawings(data){
  S.drawings=[];
  // Clear all existing layer SVGs
  const dc=$('draw-layers');
  if(dc) dc.innerHTML='';
  drawLayer.innerHTML='';
  if(!data) return;
  let parsed=null;
  try{ parsed=JSON.parse(data); }catch(e){ /* legacy HTML string */ }
  if(parsed && typeof parsed==='object'){
    Object.entries(parsed).forEach(([lid,html])=>{
      if(lid==='_legacy'){ drawLayer.innerHTML=html||''; return; }
      const layerId=parseInt(lid);
      const svg=ensureLayerSvg(layerId);
      svg.innerHTML=html||'';
      const els=[...svg.children].filter(c=>c.tagName!=='defs');
      els.forEach(el=>el.setAttribute('data-lid',layerId));
      S.drawings.push(...els);
    });
  } else if(typeof data==='string' && data.trim().startsWith('<')){
    // Old format: plain SVG innerHTML → assign to layer 1
    const svg=ensureLayerSvg(1);
    svg.innerHTML=data;
    S.drawings=[...svg.children].filter(c=>c.tagName!=='defs');
    S.drawings.forEach(el=>el.setAttribute('data-lid',1));
  }
  // Also collect legacy drawLayer children
  const legacy=[...drawLayer.children].filter(c=>c.tagName!=='defs');
  S.drawings.push(...legacy);
  // Re-apply layer visibility
  (S.layers||[]).forEach(layer=>{
    if(!layer.visible){
      S.drawings.filter(el=>el.getAttribute&&el.getAttribute('data-lid')==String(layer.id))
        .forEach(el=>el.style.display='none');
    }
  });
}

// ── Capture current board state as plain object ──
function captureBoard(){
  const name = $('board-name-display').textContent;
  // Serialize items — Video-fileData als Platzhalter speichern (zu groß für JSON)
  const items = S.items.map(it=>{
    const copy={...it};
    if(copy.fileData && isVideo(copy.name||'')) copy.fileData='__video_session_only__';
    return copy;
  });
  return {
    name,
    items,
    drawings: serializeDrawings(),
    zoom:S.zoom, panX:S.panX, panY:S.panY,
    gridVisible:S.gridVisible,
    bgImage:S.bgImage, bgOpacity:S.bgOpacity||85, bgSize:S.bgSize||'cover',
    bgColor:S.bgColor||'#0e0f11',
    layers:S.layers,activeLayerId:S.activeLayerId,nextLayerId:S.nextLayerId,
    savedAt: Date.now(),
  };
}

// ── Restore board state from plain object ──
function restoreBoard(data){
  // Clear canvas
  itemsLayer.innerHTML = '<div id="selection-box"></div>';
  S.items = [];
  S.selectedIds = new Set();
  S.nextId = 1;
  clearDrawings();

  if(!data) { resetView(); return; }

  // Restore name
  const nm = data.name||'Unbenanntes Board';
  $('board-name-display').textContent = nm;
  document.title = nm;

  // Restore items
  // Close any open folder windows before loading new board
  Object.keys(_folderWindows).forEach(k=>{if(_folderWindows[k])_folderWindows[k].remove();delete _folderWindows[k];});
  // Rehydrate IDB file refs then render items
  restoreBoardDataAsync(data).then(rehydrated=>{
    // Migration: Video-Items die fälschlich als preview-doc gespeichert wurden
    (rehydrated.items||[]).forEach(it=>{
      if(it.type==='file'&&isVideo(it.name||'')&&it.viewMode==='preview-doc'){
        it.viewMode='preview-video';
      }
    });
    // bgImage nach IDB-Auflösung setzen (war vorher idb:-Key)
    if(rehydrated.bgImage && !rehydrated.bgImage.startsWith('idb:')){
      setBgImage(rehydrated.bgImage, rehydrated.bgOpacity||85, rehydrated.bgSize||'cover');
    }
    (rehydrated.items||[]).forEach(it=>{
      if(it.id >= S.nextId) S.nextId = it.id+1;
      S.items.push(it);
      renderItem(it);
    });
    renderLayerList();
    applyLayerOrder();  // draw-layers/items-layer z-index nach Restore setzen
  }).catch(()=>{
    (data.items||[]).forEach(it=>{
      if(it.id >= S.nextId) S.nextId = it.id+1;
      S.items.push(it);
      renderItem(it);
    });
    renderLayerList();
  });

  // Restore drawings
  deserializeDrawings(data.drawings||'');

  // Restore view
  S.zoom = data.zoom||1;
  S.panX = data.panX||80;
  S.panY = data.panY||80;
  applyTransform();

  // Restore grid
  S.gridVisible = data.gridVisible!==false;
  $('grid-overlay').style.opacity = S.gridVisible?'.45':'0';
  $('tool-grid')?.classList.toggle('active',S.gridVisible);

  // Restore background — vollständig pro Board zurücksetzen
  if(data.bgImage && !data.bgImage.startsWith('idb:')){
    setBgImage(data.bgImage, data.bgOpacity||85, data.bgSize||'cover');
  } else if(!data.bgImage){
    // Hintergrund komplett entfernen
    S.bgImage=null; S.bgOpacity=85; S.bgSize='cover';
    const ov2=document.getElementById('bg-overlay');
    if(ov2){ ov2.style.backgroundImage='none'; ov2.style.opacity='0'; }
  }
  // idb:-bgImage wird nach restoreBoardDataAsync aufgelöst (siehe unten)
  // Restore bg color
  setBgColor(data.bgColor||'#0e0f11');
  // Restore layers
  if(data.layers&&data.layers.length){
    S.layers=data.layers;
    S.activeLayerId=data.activeLayerId||data.layers[0].id;
    S.nextLayerId=data.nextLayerId||data.layers.length+2;
    S.layers.forEach(l=>ensureLayerSvg(l.id));
  } else {
    S.layers=[{id:1,name:'Ebene 1',visible:true,locked:false}];
    S.activeLayerId=1;S.nextLayerId=2;
    // Assign all items to layer 1
    S.items.forEach(it=>{if(!it.layerId)it.layerId=1;});
  }
  // Update layer panel if open
  if($('layer-panel')?.classList.contains('open')) renderLayerList();
}

// ── Load all boards from localStorage ──
function saveStorage(store){
  try {
    const json = JSON.stringify(store);
    localStorage.setItem(STORAGE_KEY, json);
    return true;
  } catch(e){
    // localStorage full — show user warning
    console.warn('BoardDesk: localStorage voll', e);
    const banner = document.getElementById('save-error-banner') || (() => {
      const b = document.createElement('div');
      b.id = 'save-error-banner';
      b.style.cssText = 'position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#e74c3c;color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;font-family:var(--mono);z-index:99999;pointer-events:auto;cursor:pointer;';
      b.textContent = '⚠ Speicher voll — Board-Export empfohlen! (Klicken zum Schließen)';
      b.onclick = () => b.remove();
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 8000);
      return b;
    })();
    return false;
  }
}
function loadStorage(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); } catch(e){ return null; }
}

// ── Autosave current board ──
function scheduleSave(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>saveNow(), 3000); // 3s debounce — nicht zu oft speichern
}
function saveNow(){
  const store = loadStorage() || { boards:[], activeId:null };
  const id = store.activeId;
  if(!id) return;
  captureBoardAsync().then(({board})=>{
    const store2 = loadStorage() || { boards:[], activeId:null };
    const idx = store2.boards.findIndex(b=>b.id===id);
    if(idx>=0) store2.boards[idx] = {...store2.boards[idx], ...board};
    else store2.boards.push({id, ...board});
    saveStorage(store2);
    // Board-Liste nur neu rendern wenn Panel offen — sonst unnötiger DOM-Overhead
    if(_boardPanelOpen) renderBoardList(store2);
  }).catch(err=>{
    console.warn('Async save failed, trying sync:', err);
    const store3 = loadStorage() || { boards:[], activeId:null };
    const idx = store3.boards.findIndex(b=>b.id===id);
    const data = captureBoard();
    if(idx>=0) store3.boards[idx] = {...store3.boards[idx], ...data};
    else store3.boards.push({id, ...data});
    saveStorage(store3);
    if(_boardPanelOpen) renderBoardList(store3);
  });
}
function flashSave(){
  const el=$('save-indicator');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'),1500);
}

// ── Board panel ──

  _boardPanelOpen=!_boardPanelOpen;
  $('board-panel').classList.toggle('open',_boardPanelOpen);

  if(_boardPanelOpen){
    const store=loadStorage()||{boards:[],activeId:null};

function renderBoardList(store){
  const list=$('bp-list');
  list.innerHTML='';
  if(!store.boards.length){
    list.innerHTML='<div style="padding:16px;text-align:center;font-size:11px;font-family:var(--mono);color:var(--text-dimmer)">Noch keine gespeicherten Boards</div>';
    return;
  }
  store.boards.forEach(b=>{

    const card=document.createElement('div');
    card.className='bp-card'+(isActive?' active':'');
    const itemCount=(b.items||[]).length;
    const saved=b.savedAt?new Date(b.savedAt).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'–';
    card.innerHTML=`
      <div class="bp-thumb">${getBoardEmoji(b)}</div>
      <div class="bp-info">
        <div class="bp-name">${escHtml(b.name||'Unbenannt')}</div>
        <div class="bp-meta">${itemCount} Elemente · ${saved}</div>
      </div>
      <div class="bp-actions">
        <button class="bp-act" title="Umbenennen" data-onclick="renameBoardById('${b.id}')">✏️</button>
        <button class="bp-act" title="Duplizieren" data-onclick="duplicateBoardById('${b.id}')">⧉</button>
        <button class="bp-act del" title="Löschen" data-onclick="deleteBoardById('${b.id}')">🗑</button>
      </div>`;
    if(!isActive) card.addEventListener('click',e=>{if(!e.target.closest('.bp-act'))switchBoard(b.id);});
    list.appendChild(card);
  });
}

function getBoardEmoji(b){
  // pick an emoji based on board name or content
  const name=(b.name||'').toLowerCase();
  if(name.includes('film')||name.includes('dreh')) return '🎬';
  if(name.includes('musik')||name.includes('music')) return '🎵';
  if(name.includes('plan')||name.includes('ablauf')) return '📅';
  if(name.includes('idee')||name.includes('idea')) return '💡';
  if(name.includes('research')||name.includes('recherche')) return '🔍';
  return '📋';
}

// ── Re-compress all images on current board ──
function recompressAllImages(maxPx, quality, onProgress, onDone){
  const imageItems = S.items.filter(it=>it.type==='image'&&it.src&&it.src.startsWith('data:'));
  if(!imageItems.length){onDone(0);return;}
  let done=0;
  const total=imageItems.length;
  function next(){
    if(done>=total){onDone(total);return;}
    const item=imageItems[done];
    compressImage(item.src, maxPx, quality, compressed=>{
      item.src=compressed;
      // Also update the rendered img element
      const el=$('item-'+item.id);
      if(el){const img=el.querySelector('img');if(img)img.src=compressed;}
      done++;
      if(onProgress) onProgress(done,total);
      // Process next after small delay to avoid blocking UI
      setTimeout(next, 10);
    });
  }
  next();
}

    if(it.children) it.children.forEach(ch=>{

    });

  const mb=(totalBytes/1024/1024).toFixed(1);

        closeModal();

    +'padding:24px 32px;font-size:13px;font-family:var(--mono);z-index:99999;'

function exportBoard(){
  const board = captureBoard();
  // Deep clone so we can safely rehydrate idb: refs without mutating S.items
  const boardCopy = JSON.parse(JSON.stringify(board));
  const safeName = (boardCopy.name||'board').replace(/[^a-zA-Z0-9_\-äöüÄÖÜ]/g,'_');

  // Progress-Dialog mit Balken
  const _toast=document.createElement('div');
  _toast.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);'
    +'background:var(--surface);border:1px solid var(--accent);border-radius:14px;'
    +'padding:24px 32px;font-size:13px;font-family:var(--mono);z-index:99999;'
    +'min-width:320px;box-shadow:0 8px 40px rgba(0,0,0,.7);text-align:center;';
  _toast.innerHTML='\
    <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px">💾 Board speichern</div>\
    <div id="_save_msg" style="color:var(--text-dim);margin-bottom:14px">Daten werden vorbereitet…</div>\
    <div style="background:var(--surface2);border-radius:8px;overflow:hidden;height:8px;">\
      <div id="_save_bar" style="height:100%;width:0%;background:var(--accent);border-radius:8px;transition:width .3s ease;"></div>\
    </div>\
    <div id="_save_pct" style="color:var(--text-dimmer);font-size:10px;margin-top:6px">0%</div>';
  document.body.appendChild(_toast);
  function _setProgress(pct, msg){
    const bar=document.getElementById('_save_bar');
    const lbl=document.getElementById('_save_msg');
    const pctEl=document.getElementById('_save_pct');
    if(bar) bar.style.width=pct+'%';
    if(lbl&&msg) lbl.textContent=msg;
    if(pctEl) pctEl.textContent=Math.round(pct)+'%';
  }
  _setProgress(10,'Bilder und Dateien laden…');

  restoreBoardDataAsync(boardCopy).then(full=>{
    _setProgress(60,'Datei wird erstellt…');
    const json = JSON.stringify(full, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const sizeMB = (blob.size/1024/1024).toFixed(1);

    const finish=(ok)=>{
      _setProgress(100, ok ? '✓ Gespeichert ('+sizeMB+' MB)' : '⬇ Download läuft ('+sizeMB+' MB)');
      document.getElementById('_save_bar').style.background=ok?'#2ecc71':'var(--accent)';
      setTimeout(()=>_toast.remove(),2000);
    };

    // File System Access API — speichert direkt lokal ohne Download-Dialog
    if(window.showSaveFilePicker){
      _setProgress(75,'Speicherort wählen…');
      window.showSaveFilePicker({
        suggestedName: safeName+'.json',
        types:[{description:'BoardDesk Board',accept:{'application/json':['.json']}}]
      }).then(fh=>{ _setProgress(85,'Datei wird geschrieben…'); return fh.createWritable(); })
        .then(w=>w.write(blob).then(()=>w))
        .then(w=>w.close())
        .then(()=>finish(true))
        .catch(err=>{
          if(err.name==='AbortError'){_toast.remove();return;}
          _fallbackDownload(blob, safeName+'.json');
          finish(false);
        });
      return;
    }
    // Tauri: nativer Speichern-Dialog
    if(typeof window.BoardFile!=='undefined'&&window.BoardFile.isTauri){
      // BoardFile.save erwartet captureBoard()-Daten — wir nutzen direkt den JSON-Blob
      _toast.innerHTML='<span style="color:var(--accent)">💾</span> Speichern…';
      const reader=new FileReader();
      reader.onload=()=>{
        // Via Tauri-Bridge speichern
        import('@tauri-apps/api/core').then(({invoke})=>{
          const arr=Array.from(new Uint8Array(reader.result));
          invoke('save_board',{path:null,data:arr})
            .then(()=>finish(true))
            .catch(()=>{_fallbackDownload(blob,safeName+'.json');finish(false);});
        }).catch(()=>{_fallbackDownload(blob,safeName+'.json');finish(false);});
      };
      reader.readAsArrayBuffer(blob);
      return;
    }
    // Fallback: Browser-Download
    _fallbackDownload(blob, safeName+'.json');
    finish(false);
  }).catch(err=>{
    _toast.remove();
    showInfo('Speichern fehlgeschlagen: '+err.message);
  });
}

function _fallbackDownload(blob, filename){
  // Standard download link approach
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.cssText = 'position:fixed;top:-200px;opacity:0;';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 3000);
}

// ── Import board from JSON file ──
function importBoard(event){
  const files=Array.from(event.target.files);if(!files.length) return;
  saveNow();
  let pending=files.length;
  const store=loadStorage()||{boards:[],activeId:null};
  let lastId=null;

  // Helper: nimmt einen Text-String (JSON), versucht zu parsen + ins Store zu legen
  const _ingestJson = (jsonText, fileName)=>{
    try{
      const data=JSON.parse(jsonText);
      if(data.boards&&Array.isArray(data.boards)){
        data.boards.forEach(b=>{
          const id='board_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
          const imported={...b,id,savedAt:Date.now()};
          store.boards.push(imported);
          lastId=id;
        });
      } else if(data.name&&Array.isArray(data.items)){
        const id='board_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
        const imported={...data,id,savedAt:Date.now()};
        store.boards.push(imported);
        lastId=id;
      } else {
        throw new Error('Ungültiges Format');
      }
    } catch(err){
      showInfo('Fehler in "'+fileName+'": '+err.message);
    }
  };

  const _onDone = ()=>{
    pending--;
    if(pending===0&&lastId){
      store.activeId=lastId;
      saveStorage(store);
      const active=store.boards.find(b=>b.id===lastId);
      if(active) restoreBoard(active);
      renderBoardList(store);
      showInfo('Import erfolgreich! '+files.length+' Datei'+(files.length>1?'en':'')+' importiert.');
    } else if(pending===0){
      showInfo('Import abgeschlossen — keine validen Boards gefunden.');
    }
  };

  files.forEach(file=>{
    const isBoardFile = /\.board$/i.test(file.name);
    if(isBoardFile){
      // .board-Format: könnte ZIP-Container (JSZip) oder einfach JSON mit anderer Endung sein
      const reader=new FileReader();
      reader.onload=async e=>{
        const arrayBuf = e.target.result;
        // Versuch 1: als ZIP entpacken (JSZip ist global verfügbar)
        try{
          if(typeof JSZip !== 'undefined'){
            const zip = await JSZip.loadAsync(arrayBuf);
            // Suche nach board.json oder erstem .json darin
            let entryName = null;
            zip.forEach((path, entry)=>{
              if(!entry.dir && /\.json$/i.test(path) && !entryName) entryName = path;
            });
            if(entryName){
              const text = await zip.file(entryName).async('string');
              _ingestJson(text, file.name);
              _onDone();
              return;
            }
          }
        } catch(_){
          // Kein gültiges ZIP — fallback auf Text-Lesen
        }
        // Versuch 2: als reiner JSON-Text lesen (manche .board sind nur umbenannt)
        try{
          const text = new TextDecoder('utf-8').decode(arrayBuf);
          _ingestJson(text, file.name);
        } catch(err){
          showInfo('Konnte "'+file.name+'" nicht lesen: '+err.message);
        }
        _onDone();
      };
      reader.readAsArrayBuffer(file);
    } else {
      // Standard .json-Datei als Text lesen
      const reader=new FileReader();
      reader.onload=e=>{
        _ingestJson(e.target.result, file.name);
        _onDone();
      };
      reader.readAsText(file);
    }
  });
  event.target.value='';
}

// ── Input change-Events per JS verdrahten ──
// (onchange-Attribute im pointer-events:none-Container werden ignoriert)
(function(){
  function wire(id, fn){
    const el=document.getElementById(id);
    if(el){ el.addEventListener('change',fn); }
  }
  // ── Dynamische Input-Erzeugung ──
  // Inputs werden nur kurz erzeugt wenn gebraucht, dann sofort wieder gelöscht.
  // Verhindert WebView2-Rendering von "Datei auswählen"-Buttons im Vollbild.
  window._openFileInput = function(id, accept, multiple, onchange){
    // Remove any existing
    const old = document.getElementById(id);
    if(old) old.remove();
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.id = id;
    inp.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:0;height:0;opacity:0;';
    if(accept) inp.accept = accept;
    if(multiple) inp.multiple = true;
    inp.addEventListener('change', e=>{
      onchange(e);
      setTimeout(()=>inp.remove(), 500);
    });
    inp.addEventListener('cancel', ()=>setTimeout(()=>inp.remove(), 100));
    document.body.appendChild(inp);
    inp.click();
  };

  window._openColorInput = function(currentValue, onChange){
    const old = document.getElementById('bg-color-input');
    if(old) old.remove();
    const inp = document.createElement('input');
    inp.type = 'color';
    inp.id = 'bg-color-input';
    inp.value = currentValue || '#0e0f11';
    inp.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:0;height:0;opacity:0;';
    inp.addEventListener('input',  e=>onChange(e.target.value));
    inp.addEventListener('change', e=>{ onChange(e.target.value); setTimeout(()=>inp.remove(), 100); });
    inp.addEventListener('cancel', ()=>setTimeout(()=>inp.remove(), 100));
    document.body.appendChild(inp);
    inp.click();
  };

  // Patch data-onclick handlers to use dynamic inputs
  // (update the polyfill-called functions)
  const _wire = function(){
    // Polyfill calls data-onclick which calls these functions
    // We override them to use _openFileInput
  };

  // Text-Picker
  const tpFont=document.getElementById('tp-font-select');
  if(tpFont){
    tpFont.addEventListener('change', e=>setTextFont(e.target.value));
    tpFont.addEventListener('input',  e=>setTextFont(e.target.value));
  }
  const tpSizeR=document.getElementById('tp-size-range');
  if(tpSizeR) tpSizeR.addEventListener('input', e=>setTextSize(+e.target.value));
  const tpSizeN=document.getElementById('tp-size-num');
  if(tpSizeN) tpSizeN.addEventListener('input', e=>setTextSize(+e.target.value));
})();
