on:
  push:
    branches: [main, shape-reordering, shape-reordering1, shape-reordering2]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repo-Inhalt vor Build
        shell: pwsh
        run: |
          Write-Host "=== Repo root ==="
          Get-ChildItem -Force
          Write-Host "=== src-tauri/ ==="
          Get-ChildItem src-tauri -Force
          Write-Host "=== Existiert target/? ==="
          Test-Path src-tauri/target

      - name: Dist-Ordner erstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/dist | Out-Null
          Copy-Item index.html src-tauri/dist/ -Verbose
          Copy-Item boarddesk-tauri-bridge.js src-tauri/dist/ -Verbose
          Write-Host "=== Inhalt von src-tauri/dist/ nach Copy ==="
          Get-ChildItem src-tauri/dist -Force
          Write-Host "=== Groesse der index.html ==="
          (Get-Item src-tauri/dist/index.html).Length
          Write-Host "=== Erste 5 Zeilen index.html ==="
          Get-Content src-tauri/dist/index.html -TotalCount 5

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Tauri CLI installieren
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Windows Build
        run: cargo tauri build --verbose
        working-directory: src-tauri

      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: BoardDesk-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
